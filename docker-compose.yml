services:
  olx-hunter:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: olx-hunter-ai:latest
    container_name: olx-hunter-ai

    # Restart policy: always bring back up unless explicitly stopped
    restart: unless-stopped

    # Reliable DNS resolvers (prevents local systemd-resolved/Tailscale DNS flapping)
    dns:
      - 8.8.8.8
      - 1.1.1.1

    # Load secrets from .env file (never bake these into the image)
    env_file:
      - .env

    # Mount SQLite database directory for persistence across restarts
    volumes:
      - olx_data:/app/data

    # Resource limits — prevent runaway memory on the host
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

    # Health check: verify the process is running every 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio, aiosqlite; asyncio.run(aiosqlite.connect('data/seen_offers.db'))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  olx_data:
    driver: local
